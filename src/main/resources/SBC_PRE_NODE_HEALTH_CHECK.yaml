# ============================================================================
# SBC Pre-Node Health Check block
# Extends SBC_common_blocks.yaml with SBC-specific health check commands.
#
# Include in any SBC template that needs the full node health check:
#   includes:
#     - "SBC_PRE_NODE_HEALTH_CHECK.yaml"
#
# Transitively pulls in SBC_common_blocks.yaml (commands, storagePath,
# backup, activity, postNodeHealthCheck, rollback defaults).
# ============================================================================

preNodeHealthCheck:
  - name: "PRE_NODE_HEALTH_CHECK"
    description: "Verify node stability and capture baseline state before configuration changes"
    method: CLI
    commands:
      - "cm_adm -a health"
      - "virsh list --all"
      - "sbc_health --test all"
      - "alarm_check --action health"
      - "alarm_cli --list all"
      - "lcp_status"
      - "rem_srv_state --action display --set all"