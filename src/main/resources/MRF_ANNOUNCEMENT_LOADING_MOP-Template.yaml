# ============================================================================
# MOP Template: MRF - ANNOUNCEMENT_LOADING
# Naming convention: {NODE_TYPE}_{ACTIVITY}_MOP-Template.yaml
#
# Use-case: Load announcement audio files (TAR or individual) onto MRF nodes.
# Mode: Static CLI — no CIQ-driven XML generation.
#       All configuration blocks are defined explicitly under 'execution'.
#
# Assumptions:
#   - Announcement files are uploaded to the Repository server before ordering.
#   - ANN_DIR = /var/opt/swms/clips/persistent/provisioned/audioclips/<CIRCLE>/PREPAID/
#   - Login to NE is performed via NIAM (CTRL+P+E to switch to root).
# ============================================================================

# No XML generation needed for this activity — omit xmlBuilder, defaultNamespace,
# netconfNamespace, configAttributes, and tables sections entirely.

# ============================================================================
# CONSTANTS
# Named values substituted into every command at MOP generation time.
# Reference a constant anywhere in commands using $KEY syntax.
# ============================================================================
constants:
  #ANN_DIR:  "/var/opt/swms/clips/persistent/provisioned/audioclips/${CIRCLE}/PREPAID"
 
# MOP generation mode (per GROUP within a CRGROUP):
#   GROUP — one shared MOP per GROUP: <base>_<group>_MOP.<ext>
#   NODE  — one MOP per node:         <base>_<node>_MOP.<ext>
mopGenerationMode: NODE

# Approval document format:
#   TEXT    — no separate approval doc; the MOP file itself is used for approval
#   HTML    — generates an HTML approval document
#   MSWORD  — generates a .docx MS Word approval document
# Approval summary is always one per CRGROUP: <base>_<crgroup>_SUMMARY.<ext>
mopApprovalFormatType: HTML
# ============================================================================
# SECTION 1 — PRE_NODE_HEALTH_CHECK
# ============================================================================
preNodeHealthCheck:
  - name: "PRE_NODE_HEALTH_CHECK"
    description: "Verify MRF node health before announcement loading"
    targetNode: "MRF_NODE"
    method: CLI
    commands:
      - cmd: "CTRL+P+E"                # Switch to Privilege Mode
        description: "Switch to Privilege Mode"
        validation: "Output should contain text 'Privilege Escalation successful.'"
      - cmd: "date"                    # INFO
        description: "Prints System Date"
        validation: "Info Only"
      - cmd: "time"                    # INFO
        description: "Prints System Time"
        validation: "Info Only"
      - cmd: "service swms status"     # Validate: service must be running
        description: "Verify SWMS services are running before loading files"
        validation: "Output must show 'active (running)'"

# ============================================================================
# SECTION 2 — BACKUP
# Back up existing announcement files so rollback can restore them.
# ============================================================================
backup:
  - name: "BACKUP"
    description: "Back up existing announcement files before loading new ones"
    targetNode: "MRF_NODE"
    method: CLI
    commands:
     - cmd: "ls -lrth ${MRF_DESTINATION_PATH}"
       description: "Display Files and folders in the announcement directory"
       validation: "Validate that files and folders exists in the announcement directory "
     - cmd: "mkdir -p /tmp/${VERSION}/"
       description: "Creates temp directory with the MRF version"
       validation: "Validate that a mkdir command is executed successfully, with no errors"
     - cmd: "cp -rp ${MRF_DESTINATION_PATH}/* /tmp/${VERSION}/"
       description: "Copy all files and folders from announcement directory to temp directory"
       validation: "Validate that a cp command is executed successfully, with no errors"

# ============================================================================
# SECTION 3 — ACTIVITY
# 3a. ACTIVITY_PRECHECK   — baseline state before loading
# 3b. ACTIVITY_EXECUTION  — file transfer and loading (static CLI)
# 3c. ACTIVITY_POSTCHECK  — verify files loaded with correct permissions
# ============================================================================
activity:

  # --------------------------------------------------------------------------
  # 3a. ACTIVITY_PRECHECK
  # --------------------------------------------------------------------------
  precheck:
    - name: "ACTIVITY_PRECHECK"
      description: "Capture pre-activity state of announcement directory"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
        - cmd: "ls -ltrh ${MRF_DESTINATION_PATH} | grep \"${INPUT_FILE}\""
          description: "List all the files in announcement directory with files name matching input file"
          validation: "Validate if input file already exists in announcement directory"

  # --------------------------------------------------------------------------
  # 3b. ACTIVITY_EXECUTION  (static CLI mode — no 'configuration' list needed)
  # Transfer announcement files and load them into the announcement directory.
  # --------------------------------------------------------------------------
  execution:
    - name: "TRANSFER_ANNOUNCEMENT_FILES"
      description: "SFTP announcement files (TAR or individual) to /tmp on MRF"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
        - "# SFTP the announcement file(s) relevant for this MRF to /tmp"
        - "sftp /<SOURCE_DIR>  /tmp/${INPUT_FILE}"

    - name: "LOAD_ANNOUNCEMENT_FILES"
      description: "Copy announcement files to announcement directory and set permissions"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
        - if: "${VERSION} == 13.X.X.X" # matches regex i.e X means anything. check docs for exact usage
          then: # Copy individual files from untar folder
            - cmd: "cp -r /tmp/${INPUT_FILE | stripExt}/* ${MRF_DESTINATION_PATH}"
              description: "Copy individual files from untar(temp) folder to announcement directory"
              validation: "Validate that copy command is executed successfully"           
            - cmd: "chmod 777 ${MRF_DESTINATION_PATH}"
              description: "change file permission to 777"
              validation: "Validate that chmod command is executed successfully"
          else: # Untar directly to announcement directory
            - cmd: "tar -xf /tmp/${INPUT_FILE} -C ${MRF_DESTINATION_PATH}"
              description: "Untar input file to directly to announcement directory"
              validation: "Validate that tar command is executed successfully"
            - cmd: "chmod 777 ${MRF_DESTINATION_PATH}"
              description: "change file permission to 777"
              validation: "Validate that chmod command is executed successfully"

  # --------------------------------------------------------------------------
  # 3c. ACTIVITY_POSTCHECK
  # --------------------------------------------------------------------------
  postcheck:
    - name: "ACTIVITY_POSTCHECK"
      description: "Verify announcement files copied correctly with right permissions"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
        - cmd: "ls -ltrh ${MRF_DESTINATION_PATH} | grep \"/${INPUT_FILE | stripExt}\""
          description: "List all the files in announcement directory with same name as input file"
          validation: "Validate if input file already exists in announcement directory and there permission should -rwxrwxrwx"
# ============================================================================
# SECTION 4 — POST_NODE_HEALTH_CHECK
# ============================================================================
postNodeHealthCheck:
  - name: "POST_NODE_HEALTH_CHECK"
    description: "Verify MRF node health after announcement loading"
    targetNode: "MRF_NODE"
    method: CLI
    commands:
     - cmd: "service swms status"     # Validate: service must be running
       description: "Verify SWMS services are running before loading files"
       validation: "Output must show 'active (running)'"      

# ============================================================================
# SECTION 5 — ROLLBACK
# 5a. ROLLBACK_PRECHECK   — verify backup exists before restoring
# 5b. ROLLBACK_EXECUTION  — restore backup or remove newly loaded files
# 5c. ROLLBACK_POSTCHECK  — verify announcement directory state after rollback
# ============================================================================
rollback:

  # --------------------------------------------------------------------------
  # 5a. ROLLBACK_PRECHECK
  # --------------------------------------------------------------------------
  precheck:
    - name: "ROLLBACK_PRECHECK"
      description: "Verify backup exists and node state before rollback"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
       - cmd: "CTRL+P+E"                # Switch to Privilege Mode
         description: "Switch to Privilege Mode"
         validation: "Output should contain text 'Privilege Escalation successful.'"
       - cmd: "ls -lrth /tmp/${VERSION}" # Confirm backup is present
         description: "Lists all the files in temp directory with MRF Node version"
         validation: "Validate if input file backup files(same version name) exists in tmp directory"
                 
  # --------------------------------------------------------------------------
  # 5b. ROLLBACK_EXECUTION  (static CLI mode — no 'configuration' list needed)
  # Restore backup if it exists; otherwise remove the newly loaded files.
  # --------------------------------------------------------------------------
  execution:
    - name: "ROLLBACK_ANNOUNCEMENT_FILES"
      description: "Restore announcement files from backup or remove new files"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
       - cmd: "cp -r /tmp/${VERSION}/*  ${MRF_DESTINATION_PATH}"  
         description: "Restore or Copy the backup files in announcement directory"
         validation: "Validate that copy command is executed successfully"
       - cmd: "rm -f ${MRF_DESTINATION_PATH}/*" 
         description: "Remove the announcement file from announcement directory"
         validation: "Validate that rm command is executed successfully"

  # --------------------------------------------------------------------------
  # 5c. ROLLBACK_POSTCHECK
  # --------------------------------------------------------------------------
  postcheck:
    - name: "ROLLBACK_POSTCHECK"
      description: "Verify rollback completed and announcement directory is restored"
      targetNode: "MRF_NODE"
      method: CLI
      commands:
       - cmd: "ls -lrth ${MRF_DESTINATION_PATH}"
         description: "Lists all the files in announcement directory"
         validation: "Validate if backup files exists in announcement directory"
